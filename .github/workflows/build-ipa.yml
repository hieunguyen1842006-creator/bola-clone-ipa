name: NVH MOD IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # 2 runner chạy song song: lấy được runner nào trước thì có IPA ngay.
    # (GitHub hay hết capacity cho macos-14 -> job nằm hàng đợi rồi bị huỷ.)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project (xcodegen — gồm cả file Swift mới + entitlements)
        run: brew install xcodegen && xcodegen generate

      - name: Self-test (core logic)
        run: swift run -c debug BolaSelfTest

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project BolaClone.xcodeproj \
            -scheme BolaClone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf out NVH-MOD-unsigned.ipa
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/NVHMOD.app out/Payload/
          cd out && zip -qry ../NVH-MOD-unsigned.ipa Payload
          ls -lh ../NVH-MOD-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NVH-MOD-unsigned-ipa-${{ matrix.os }}
          path: NVH-MOD-unsigned.ipa
