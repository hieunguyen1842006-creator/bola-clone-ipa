# XcodeGen — sinh BolaClone.xcodeproj từ file này:
#   brew install xcodegen && xcodegen generate
# (repo cũng kèm sẵn BolaClone.xcodeproj dựng tay, mở trực tiếp cũng được)
name: BolaClone
options:
  bundleIdPrefix: com.clone.bola
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    OTHER_LDFLAGS: "-framework AVFoundation"
targets:
  BolaClone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Vendor3105
      - path: Resources
        excludes:
          - "Info.plist"
          - "NVHMenu.bytes"
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/nvh_silence.wav
      - path: Resources/NVHMenu.bytes
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: NVH MOD
    settings:
      base:
        PRODUCT_NAME: NVHMOD
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Vendor3105/BolaClone-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  BolaClone:
    build:
      targets:
        BolaClone: all
    run:
      config: Debug
    archive:
      config: Release
