# XcodeGen — sinh BolaClone.xcodeproj từ file này:
#   brew install xcodegen && xcodegen generate
# (repo cũng kèm sẵn BolaClone.xcodeproj dựng tay, mở trực tiếp cũng được)
name: BolaClone
options:
  bundleIdPrefix: com.clone.bola
  # CI (macos-14) chạy Xcode 15.4 — không đọc được project format 77 của xcodegen mới
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    OTHER_LDFLAGS: "-framework AVFoundation"
targets:
  BolaClone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Vendor3105
      # CHÚ Ý: vault/bytes/wav/xcassets nằm trong scan Resources luôn — xcodegen
      # tự xếp file lạ vào Resources phase. Trước đây ta exclude vault khỏi
      # sources rồi liệt kê lại ở `resources:` — xcodegen 2.46 bị dedupe làm
      # RƠI vault khỏi .app -> inject báo "Patch chưa sẵn sàng".
      - path: Resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: NVH MOD
    settings:
      base:
        PRODUCT_NAME: NVHMOD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BolaClone.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Vendor3105/BolaClone-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  BolaClone:
    build:
      targets:
        BolaClone: all
    run:
      config: Debug
    archive:
      config: Release
